name: Diagnóstico del lector (temporal)
on:
  push:
    branches: [claude/project-thread-f914u7]
    paths: [".github/diag/**", "src/leer_partido.py", ".github/workflows/diag-lector.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pandas pyarrow numpy
      - env: {CONTACTO: "${{ secrets.CONTACTO }}"}
        run: python .github/diag/diag.py
